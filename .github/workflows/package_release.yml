name: Package Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package Version Tag'
        required: true
        default: 'v0.9.26'
        type: string
      include_ampere_mfg:
        description: 'Include RTX 20/30 (SM75/SM86) MFG (dlssg_sm86.dll)'
        required: false
        default: false
        type: boolean
      accept_ampere_mfg_licenses:
        description: 'Accept RTX 20/30 (SM75/SM86) MFG Licenses'
        required: false
        default: false
        type: boolean
      include_dlss_fg:
        description: 'Include DLSS Frame Generation runtime'
        required: false
        default: false
        type: boolean
      accept_nvidia_licenses:
        description: 'Accept NVIDIA Licenses (if Include DLSS FG is checked)'
        required: false
        default: false
        type: boolean
      include_nvsmooth30:
        description: 'Include NVSmooth30 (RTX 30 Smooth Motion unlocker in OptiScaler/nvsmooth30.dll)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: 'true'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Ensure RTX 20/30 (SM75/SM86) files are present
      if: ${{ inputs.include_ampere_mfg }}
      shell: powershell
      run: |
        if (-not (Test-Path "dlssg_for_sm86\version.dll")) {
            Write-Host "dlssg_for_sm86 not found in working copy; cloning from SilyNoMeta fork..."
            git init dlssg_for_sm86
            git -C dlssg_for_sm86 remote add origin https://github.com/SilyNoMeta/dlssg_for_sm86.git
            git -C dlssg_for_sm86 fetch --depth 1 origin tags/v0.3.5-4
            if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch pinned SM75/SM86 0.3.5-4 runtime' }
            git -C dlssg_for_sm86 checkout --detach FETCH_HEAD
        }
        if (-not (Test-Path "dlssg_for_sm86\version.dll")) {
            Write-Error "Failed to acquire dlssg_for_sm86\version.dll"
            exit 1
        }
        Write-Host "dlssg_for_sm86 ready."

    - name: Ensure NVSmooth30 files are present
      if: ${{ inputs.include_nvsmooth30 }}
      shell: powershell
      run: |
        if (-not (Test-Path "nvsmooth30\bin\version.dll") -and -not (Test-Path "nvsmooth30\build\Release\version.dll")) {
            if (-not (Test-Path "nvsmooth30\CMakeLists.txt")) {
                Write-Host "nvsmooth30 not found; cloning from https://github.com/ItsAdeline/NVSmooth30.git..."
                git clone --depth 1 https://github.com/ItsAdeline/NVSmooth30.git nvsmooth30
                if ($LASTEXITCODE -ne 0) { throw 'Cannot clone NVSmooth30 repository' }
            }
            Write-Host "Building nvsmooth30 from source with CMake..."
            cmake -S nvsmooth30 -B nvsmooth30\build -A x64
            if ($LASTEXITCODE -ne 0) { throw 'CMake configuration for nvsmooth30 failed' }
            cmake --build nvsmooth30\build --config Release
            if ($LASTEXITCODE -ne 0) { throw 'CMake build for nvsmooth30 failed' }
            if (-not (Test-Path "nvsmooth30\bin")) {
                New-Item -ItemType Directory -Force -Path "nvsmooth30\bin" | Out-Null
            }
            Copy-Item "nvsmooth30\build\Release\version.dll" -Destination "nvsmooth30\bin\version.dll"
        }
        if (-not (Test-Path "nvsmooth30\bin\version.dll") -and -not (Test-Path "nvsmooth30\build\Release\version.dll")) {
            Write-Error "Failed to acquire or build nvsmooth30 version.dll"
            exit 1
        }
        Write-Host "nvsmooth30 ready."

    - name: Acquire verified hybrid kernels
      shell: powershell
      run: .\get_hybrid_assets.ps1 -Destination "$env:RUNNER_TEMP\hybrid-assets"

    - name: Run package_release.ps1
      shell: powershell
      env:
        PACKAGE_VERSION: ${{ inputs.version }}
      run: |
        $params = @{
            Version = $env:PACKAGE_VERSION
            HybridAssetsDirectory = "$env:RUNNER_TEMP\hybrid-assets"
        }
        if ("${{ inputs.include_ampere_mfg }}" -eq "true") {
            $params["IncludeAmpereMfg"] = $true
        }
        if ("${{ inputs.accept_ampere_mfg_licenses }}" -eq "true") {
            $params["AcceptAmpereMfgLicenses"] = $true
        }
        if ("${{ inputs.include_dlss_fg }}" -eq "true") {
            $params["IncludeDlssFrameGeneration"] = $true
        }
        if ("${{ inputs.accept_nvidia_licenses }}" -eq "true") {
            $params["AcceptNvidiaLicenses"] = $true
        }
        if ("${{ inputs.include_nvsmooth30 }}" -eq "true") {
            $params["IncludeNVSmooth30"] = $true
        }

        Write-Host "Executing package_release.ps1 with options:"
        $params.GetEnumerator() | ForEach-Object { Write-Host "  $($_.Key): $($_.Value)" }

        & .\package_release.ps1 @params
        if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) {
            exit $LASTEXITCODE
        }

    - name: Upload Release Archive
      uses: actions/upload-artifact@v4
      with:
        name: OptiScaler-Release-Package-${{ inputs.version }}
        path: release/*.zip
        if-no-files-found: error
