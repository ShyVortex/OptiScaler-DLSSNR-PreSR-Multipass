name: clang-format Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clang-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    env:
      # Keep in sync with the local toolchain. ghcr.io/jidicula/clang-format stops at 22,
      # so clang-format is installed from PyPI instead.
      CLANG_FORMAT_VERSION: '23.1.3'
      CHECK_PATH: 'OptiScaler'
      # Shader byte arrays are generated by shader_tools/create_header.py.
      EXCLUDE_REGEX: 'external/|OptiScaler/include/|OptiScaler/shaders/.*/precompile(d)?/.*\.h$'
    steps:
    - uses: actions/checkout@v6
    - name: Install clang-format
      run: |
        python3 -m pip install --user "clang-format==${CLANG_FORMAT_VERSION}"
        clang-format --version
    - name: Run clang-format style check for C/C++ sources
      run: |
        find "$CHECK_PATH" -type f -regextype posix-extended \
          -iregex '.*\.(c|cc|cpp|cxx|c\+\+|h|hh|hpp|hxx|h\+\+|ino|pde|proto|cu)$' \
          | grep -Ev "$EXCLUDE_REGEX" | sort > files.txt
        echo "Checking $(wc -l < files.txt) files"
        xargs -a files.txt -d '\n' clang-format --dry-run --Werror --style=file
